<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中建八局数字供应链 - 二级单位考核指标评分系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ 顶部导航栏（对齐知识库参照页样式） ============ -->
  <header class="dsc-header">
    <div class="dsc-header__logo">中建八局数字供应链</div>
    <nav class="dsc-header__nav">
      <div class="dsc-header__nav-item">首页</div>
      <div class="dsc-header__nav-item">智选资源</div>
      <div class="dsc-header__nav-item">智慧采购</div>
      <div class="dsc-header__nav-item">智能物管</div>
      <div class="dsc-header__nav-item dsc-header__nav-item--active">智慧运营</div>
    </nav>
    <div class="dsc-header__right">
      <!-- V3.1 五类角色与上下文切换器 -->
      <div class="dsc-header__role" title="角色与上下文切换">
        <span class="dsc-header__role-label">角色</span>
        <select class="dsc-header__role-select" id="roleSwitch">
          <option value="局总部考核专员">局总部考核专员</option>
          <option value="局供应链部领导">局供应链部领导</option>
          <option value="二级考核专员（一公司）">二级考核专员（一公司）</option>
          <option value="二级分管领导（一公司）">二级分管领导（一公司）</option>
          <option value="三级经办人（济南分公司）">三级经办人（济南分公司）</option>
        </select>
      </div>
      <div class="dsc-header__recycle" title="站内信">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 1.8a4 4 0 0 0-4 4v2.5l-1.5 2.5H13.5L12 8.3V5.8a4 4 0 0 0-4-4z"/>
          <path d="M5.5 13a2.5 2.5 0 0 0 5 0"/>
        </svg>
        <span>99+</span>
      </div>
      <div class="dsc-header__user">
        <div class="dsc-header__avatar"></div>
        <span id="headerUserName">张考核</span>
      </div>
    </div>
  </header>

  <!-- ============ 左侧导航菜单（对齐知识库参照页样式） ============ -->
  <aside class="dsc-sidebar" id="sidebar">
    <ul class="dsc-sidebar__menu">
      <!-- 参照页既有菜单（自上而下：数据大屏→数据全景→合规预警→智慧运营配置→分析报告→智链通） -->
      <li class="dsc-sidebar__menu-item dsc-sidebar__menu-item--plain">
        <span class="dsc-sidebar__menu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5"/><path d="M1.5 6h13M6 6v8.5"/></svg></span>
        <span class="dsc-sidebar__menu-text">数据大屏</span>
      </li>
      <li class="dsc-sidebar__menu-item dsc-sidebar__menu-item--plain">
        <span class="dsc-sidebar__menu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 1.5v13M1.5 8h13"/></svg></span>
        <span class="dsc-sidebar__menu-text">数据全景</span>
      </li>
      <li class="dsc-sidebar__menu-item dsc-sidebar__menu-item--plain">
        <span class="dsc-sidebar__menu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5L15 14H1z"/><path d="M8 6v3.2M8 11.6v.2" stroke-linecap="round"/></svg></span>
        <span class="dsc-sidebar__menu-text">合规预警</span>
      </li>
      <li class="dsc-sidebar__menu-item dsc-sidebar__menu-item--plain">
        <span class="dsc-sidebar__menu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="1.8"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg></span>
        <span class="dsc-sidebar__menu-text">智慧运营配置</span>
      </li>
      <li class="dsc-sidebar__menu-item dsc-sidebar__menu-item--plain">
        <span class="dsc-sidebar__menu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 1.5h9l3 3v10h-12z"/><path d="M11.5 1.5v3h3M5 6h6M5 8.5h6M5 11h4"/></svg></span>
        <span class="dsc-sidebar__menu-text">分析报告</span>
      </li>
      <li class="dsc-sidebar__menu-item dsc-sidebar__menu-item--plain">
        <span class="dsc-sidebar__menu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5v-7a1.5 1.5 0 0 1 3 0v6a1.5 1.5 0 0 0 3 0v-7"/><path d="M7.5 4.5h1.5a1.5 1.5 0 0 1 1.5 1.5v6"/></svg></span>
        <span class="dsc-sidebar__menu-text">智链通</span>
      </li>
    </ul>

    <!-- 月度考核分组（参照页菜单最下方，展开显示四子菜单） -->
    <div class="dsc-sidebar__group-head dsc-sidebar__group-head--active" id="assessmentGroupHead">
      <span class="dsc-sidebar__menu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3h-2a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1h-2"/><path d="M6 1.5h4v3H6zM5 7.5h6M5 10.5h6"/></svg></span>
      <span class="dsc-sidebar__menu-text">月度考核</span>
      <span class="dsc-sidebar__caret dsc-sidebar__caret--open" id="assessmentCaret"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></span>
    </div>
    <ul class="dsc-sidebar__submenu dsc-sidebar__submenu--open" id="assessmentSubmenu">
      <li class="dsc-sidebar__submenu-item dsc-sidebar__submenu-item--active" data-page="rules-config" data-scope="hq">
        <span class="dsc-sidebar__submenu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4.5h9M14 4.5h.5"/><path d="M1.5 11.5h4M9.5 11.5h5"/><circle cx="12" cy="4.5" r="1.3"/><circle cx="7" cy="11.5" r="1.3"/></svg></span>
        <span class="dsc-sidebar__menu-text">考核规则配置</span>
      </li>
      <li class="dsc-sidebar__submenu-item" data-page="data-collection" data-scope="hq">
        <span class="dsc-sidebar__submenu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="4.5" rx="5.5" ry="2"/><path d="M2.5 4.5v7c0 1.1 2.4 2 5.5 2s5.5-.9 5.5-2v-7M2.5 8c0 1.1 2.4 2 5.5 2s5.5-.9 5.5-2"/></svg></span>
        <span class="dsc-sidebar__menu-text">数据采集与编辑</span>
      </li>
      <li class="dsc-sidebar__submenu-item" data-page="score-ledger" data-scope="hq">
        <span class="dsc-sidebar__submenu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13V4M7 13V2.5M11.5 13V6M2 13h12"/></svg></span>
        <span class="dsc-sidebar__menu-text">月度跑批与打分台账</span>
      </li>
      <li class="dsc-sidebar__submenu-item" data-page="appeal-approval" data-scope="hq">
        <span class="dsc-sidebar__submenu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 1.5h9l3 3v10h-12z"/><path d="M11.5 1.5v3h3M5 8.5l1.8 1.8 3.7-3.8"/></svg></span>
        <span class="dsc-sidebar__menu-text">申诉审批与纠正</span>
      </li>
      <!-- V3.0 新增：二级考核专员工作台（自主考评自治空间） -->
      <li class="dsc-sidebar__submenu-item" data-page="tertiary-workspace" data-scope="hq">
        <span class="dsc-sidebar__submenu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg></span>
        <span class="dsc-sidebar__menu-text">二级考核专员工作台</span>
        <span class="dsc-sidebar__badge">二级自主考评</span>
      </li>
      <!-- V3.1：三级业务门户（三级单位角色可见，含穿透追溯/我的报送/自主考评） -->
      <li class="dsc-sidebar__submenu-item" data-page="tertiary-portal" id="portalMenuItem" data-scope="l3" style="display:none;">
        <span class="dsc-sidebar__submenu-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="1.5" width="4" height="3" rx="0.8"/><rect x="1.5" y="11.5" width="4" height="3" rx="0.8"/><rect x="10.5" y="11.5" width="4" height="3" rx="0.8"/><path d="M8 4.5V8M3.5 11.5V8h9v3.5"/></svg></span>
        <span class="dsc-sidebar__menu-text">三级业务门户</span>
        <span class="dsc-sidebar__badge dsc-sidebar__badge--plain">填报</span>
      </li>
    </ul>

    <div class="dsc-sidebar__toggle" id="sidebarToggle" title="收起菜单">
      <span id="toggleIcon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 4h13M1.5 8h13M1.5 12h13"/></svg></span>
    </div>
  </aside>

  <!-- ============ 主内容区 ============ -->
  <main class="dsc-main" id="mainContent">
    <!-- 面包屑：位置保持内容区顶部，背景与顶部导航同一蓝色（同一背景区域，白字） -->
    <div class="dsc-breadcrumb">
      首页 &gt; 智慧运营 &gt; <span id="breadcrumbPage">考核规则配置</span>
    </div>

    <!-- 页面内容容器 -->
    <div class="dsc-content" id="pageContainer">
      <!-- 动态渲染 -->
    </div>
  </main>

  <!-- ============ 模态框 ============ -->
  <div class="dsc-modal-overlay" id="modalOverlay">
    <div class="dsc-modal">
      <div class="dsc-modal__header">
        <span id="modalTitle">标题</span>
        <span class="dsc-modal__close" id="modalClose">✕</span>
      </div>
      <div class="dsc-modal__body" id="modalBody">
        <!-- 动态填充 -->
      </div>
      <div class="dsc-modal__footer" id="modalFooter">
        <button class="dsc-btn dsc-btn--default" id="modalCancel">取消</button>
        <button class="dsc-btn dsc-btn--primary" id="modalConfirm">确认</button>
      </div>
    </div>
  </div>

  <!-- ============ Toast 消息容器 ============ -->
  <div style="position:fixed;top:72px;right:24px;z-index:3000;max-width:360px;" id="toastContainer"></div>

  <!-- ============ 脚本加载 ============ -->
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
